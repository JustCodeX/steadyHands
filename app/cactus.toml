# Switches on the Cactus models (Whistle, Needle) for the nurse's treatments
# on the vitals monitor. Needs `pip install -r requirements-cactus.txt`, the
# engine (`python -m cactus fetch`, online, once) and the model files in
# app/models/ (docs/needle-integration.md). Without them the app logs one
# line per missing piece and the treatments work by their names through the
# Vosk grammar, as without this file.
#   python -m trainer --config cactus.toml
#
# The older voice commands (instruments, steady, light, pause, ...) stay on
# the Vosk grammar either way; Whistle and Needle never decide them.

[voice]
# Whistle hears sentences ("he can't breathe, do something"). A short call
# with a command phrase ("Clamp!") is decided by the grammar and never
# reaches Whistle.
sentence_recognizer = "whistle"

# Treatment phrases first ("give him oxygen"), then Needle, only while an
# alarm is open and only when a trigger word of a treatment is in the
# sentence (needle_require_trigger).
treatment_interpreter = "needle"
# needle_weights defaults to app/models/needle3-9L.cact

# The quiz is off by default since the vitals monitor. With it on, Needle can
# also judge answers that name no option in so many words:
# [quiz]
# enabled = true
# [voice]
# evaluator = "needle"
