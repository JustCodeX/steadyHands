; Steady Hands MCU firmware for the Arduino UNO Q (STM32U585).
; Build and flash through tools/board.sh, which runs PlatformIO on the board.

[platformio]
default_envs = uno_q

[env:uno_q]
platform = lee-lab-skku/arduinoq@1.0.0-rc.5
board = uno_q
framework = arduino
monitor_port = socket://localhost:7500
; The arduinoq platform installs its own patched Arduino_RouterBridge,
; Arduino_RPClite and MsgPack automatically (see .pio/libdeps after a build).
; Do not add or vendor them. Arduino_Modulino and everything its header pulls
; in come from the registry.
;
; On the UNO Q, `Serial` is provided by Arduino_RouterBridge (Monitor alias)
; and only files that can see that header get it. Arduino_LTR381RGB (pulled in
; by Modulino.h, unused by us) references Serial in its .cpp and fails, so it is
; ignored and lib/LTR381RGBStub/ supplies the header Modulino.h includes.
build_flags = -Wall
lib_ignore = Arduino_LTR381RGB
lib_deps =
  arduino-libraries/Arduino_Modulino@0.10.0
  arduino-libraries/Arduino_LSM6DSOX@1.1.2
  stm32duino/STM32duino VL53L4CD@1.0.5
  stm32duino/STM32duino VL53L4ED@1.0.1
  arduino-libraries/Arduino_LPS22HB@1.0.3
  arduino-libraries/Arduino_HS300x@1.0.1
  arduino-libraries/ArduinoGraphics@1.1.5
  robtillaart/SHT31@0.5.3

; Host unit tests for the pure C++ parts (filter, frame). Run on a computer:
;   pio test -e native      (or: uvx --from platformio pio test -e native)
[env:native]
platform = native
build_flags = -std=c++17 -Wall
lib_ldf_mode = chain
lib_ignore = TiltSensor, KnobInput, ButtonPanel, DistanceSensor, Alarm, StatusLed, BridgeLink
