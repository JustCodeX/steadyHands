; PlatformIO project for the STM32U585 MCU side of the Arduino UNO Q.
;
; Uses the unofficial lee-lab-skku/arduinoq platform. Its toolchain only runs
; on Linux, and flashing goes through OpenOCD on the board's own Linux side,
; so on macOS run builds through tools/board.sh (see README.md).

[env:uno_q]
platform = lee-lab-skku/arduinoq@1.0.0-rc.5
board = uno_q
framework = arduino

; Serial is carried over the MCU<->MPU RouterBridge, exposed on the board's
; Linux side as a TCP socket (not a USB serial port).
monitor_port = socket://localhost:7500
